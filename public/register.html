<!DOCTYPE html>
<html>
<head>
    <title>Register</title>

    <link
        rel="stylesheet"
        href="css/style.css"
    >
</head>

<body>

<div class="container">

    <h1>Register</h1>

    <input
        type="text"
        id="name"
        placeholder="Full Name"
    >

    <input
        type="email"
        id="email"
        placeholder="Email"
    >

    <input
        type="text"
        id="phone"
        placeholder="Phone Number"
    >

    <input
        type="password"
        id="password"
        placeholder="Password"
    >

    <select id="role">

        <option value="patient">
            Patient
        </option>

        <option value="admin">
            Admin
        </option>

    </select>

    <button onclick="register()">
        Register
    </button>

    <p>
        Already have account?
        <a href="login.html">
            Login
        </a>
    </p>

</div>

<script src="js/register.js"></script>

</body>
</html>
